<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Email Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: none;
            font-family: inherit;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #004494;
        }

        #result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            display: none;
            /* Hidden by default */
        }

        .phishing {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        .safe {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>🛡️ Phishing Email Detector</h2>
        <p>Paste a suspicious email below to analyze its threat level using Machine Learning.</p>

        <textarea id="emailInput" placeholder="Paste email text here..."></textarea>
        <button onclick="analyzeEmail()">Scan Email</button>

        <div id="result-box">
            <span id="result-text"></span><br>
            <small id="confidence-text"></small>
        </div>
    </div>

    <script>
        async function analyzeEmail() {
            const text = document.getElementById('emailInput').value;
            const resultBox = document.getElementById('result-box');
            const resultText = document.getElementById('result-text');
            const confidenceText = document.getElementById('confidence-text');

            // Reset UI
            resultBox.style.display = 'none';
            resultBox.className = '';

            if (!text) {
                alert("Please enter an email to scan.");
                return;
            }

            try {
                // Send POST request to Flask backend
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email_text: text })
                });

                const data = await response.json();

                if (data.error) {
                    alert("Error: " + data.error);
                    return;
                }

                // Update UI based on ML prediction
                resultBox.style.display = 'block';
                if (data.result === 'PHISHING') {
                    resultBox.classList.add('phishing');
                    resultText.innerText = "🚨 PHISHING DETECTED";
                } else {
                    resultBox.classList.add('safe');
                    resultText.innerText = "✅ SAFE EMAIL";
                }
                confidenceText.innerText = `Model Confidence: ${data.confidence}%`;

            } catch (error) {
                console.error("Error analyzing email:", error);
                alert("Failed to connect to the server.");
            }
        }
    </script>

</body>

</html>
